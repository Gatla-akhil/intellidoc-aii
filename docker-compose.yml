version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_pass_2026@postgres:5432/intellidoc?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=intellidoc-super-secret-jwt-key-2026-production-secure
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: intellidoc-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pass_2026
      POSTGRES_DB: intellidoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: intellidoc-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
